timezone_note: All submission deadlines are 11:59 PM UTC-12:00 ("Anywhere on Earth") unless otherwise noted. OpenReview is the submission system of record for exact system timestamps.
challenge_timezone_note: DocSem closes September 10. Dr.DocBench closes October 10 at 12:59 PM UTC. The official challenge portals are the system of record for exact submission status.
challenge_items:
  - label: DocSem Competition
    date: August 3–September 10, 2026
    type: challenge
    note: The training split was updated on August 31 to correct seven annotation inconsistencies. A held-out test set will be released five days before the September 10 final submission deadline.
  - label: Dr.DocBench Competition
    date: August 10–October 10, 2026
    time: 12:59 PM UTC deadline
    type: challenge
    note: Submit through EvalAI. Final evaluation runs October 11–23, with winners announced at DocInsights 2026.
  - label: DocSem Training Data Update
    date: August 31, 2026
    type: challenge
    note: Seven annotation inconsistencies were corrected in the training split following community feedback. The task definition and data format are unchanged.
  - label: DocSem Validation GT Correction
    date: August 31, 2026
    type: challenge
    note: Two organizer-only validation ground-truth labels were corrected following data review. Existing submissions were rescored and the leaderboard updated.
  - label: Shared-task Paper Submission Deadline
    date: September 15, 2026
    time: 11:59 PM UTC
    type: system paper
    action_label: Submit on OpenReview
    action_url: https://openreview.net/group?id=EMNLP/2026/Workshop/DocInsights_Shared_Task
    note: Submit an archival or non-archival system paper for DocSem or Dr.DocBench.
