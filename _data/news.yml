items:
  - date: August 10, 2026
    title: Dr.DocBench is live on EvalAI
    body: The expert-level document parsing challenge is open through October 10, 2026 at 12:59 PM UTC, with up to USD 3,000 in prizes.
  - date: August 2, 2026
    title: Direct submission deadline extended to August 10
    body: Direct papers are now due August 10, 2026 at 12:59 PM UTC (UTC+00:00). The previous August 2 deadline has been superseded.
  - date: June 2026
    title: OpenReview submission links are live
    body: Direct submissions and ARR commitments are available through separate OpenReview groups.
  - date: June 2026
    title: DocInsights is listed as an accepted EMNLP 2026 workshop
    body: The workshop is officially listed as "DocInsights - Workshop on Document Intelligence and Understanding."
  - date: April 2026
    title: Website launched
    body: Initial workshop information, CFP details, and organizer information were published.
